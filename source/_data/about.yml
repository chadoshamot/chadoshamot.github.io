topics:
  - id: llm-materialism
    title: LLM推理是唯物还是唯心？
    paragraphs:
      - 如果说LLM推理依靠的是电力，算力和模型参数，那么它依赖于现实世界的实体，由实体得出的必然结论，那么就是唯物的；
      - 如果说LLM学习的并非真正的推理，而是一遍遍对人行为，逻辑模式的重复，那么是否能说就是唯心的？

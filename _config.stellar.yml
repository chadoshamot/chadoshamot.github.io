leftbar:
  brand:
    style: compact
    name: shamot
    tagline: Nothing is impossible!
    image:
      src: https://avatars.githubusercontent.com/u/160225157?v=4
      variant: avatar
    href: /
  widgets:
    - recent
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
      accent: '#f4d35e'
    - id: projects
      title: 项目
      icon: default:category
      url: /wiki/
      accent: '#73daca'
    - id: explore
      title: 探索
      icon: default:hashtag
      url: /notes/
      accent: '#bb9af7'
    - id: friends
      title: 友链
      icon: default:link
      url: /friends/
      accent: '#9ece6a'
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
      accent: '#f79b87'
appearance:
  preset: minimal
  color_scheme: light
  colors:
    primary: '#f4d35e'
    accent: '#f4d35e'
    link: '#f4d35e'
  shape:
    radius:
      card: 14px
      card_large: 18px
  typography:
    font_size:
      root: 16px
      code_block: 0.875rem
article:
  style: tech
  listing:
    card_layout: classic
    show_tags: true
  category_colors:
    思考: '#f1d18b'
    技术: '#9acdf2'
    经验: '#acd9b1'
    设计开发: '#d6b5eb'
    学习: '#f1b5a1'
  show_reading_time: true
  footer:
    license: false
    share: []
    show_tags: true
profiles:
  home:
    leftbar:
      widgets:
        - recent
  blog_index:
    listing_nav:
      enabled: false
  page:
    leftbar:
      widgets:
        - recent
  post:
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - toc
  wiki_index:
    path: null
  notebooks:
    path: null
footer:
  content: |
    © shamot · 由 [Hexo](https://hexo.io/) 与 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 驱动。
features:
  reveal:
    enabled: true
    duration: 300
    interval: 50
    distance: 5
    blur: 0
  card_hover:
    spotlight: false
    tilt: false
  color_scheme_switch:
    enabled: false
  partial_navigation:
    enabled: true
inject:
  head_end: <link rel="stylesheet" href="/assets/shamot.css?v=9"><link rel="stylesheet" href="/assets/shamot-light.css?v=2"><link rel="stylesheet" href="/assets/shamot-dark.css?v=1"><script data-stellar-script="asset" src="/assets/shamot-palette.js?v=1"></script>
  body_end: <link rel="stylesheet" href="/assets/shamot-terminal.css?v=3"><script data-stellar-script="asset" src="/assets/shamot-terminal.js?v=4" defer></script>
structured_data:
  same_as:
    - https://github.com/chadoshamot

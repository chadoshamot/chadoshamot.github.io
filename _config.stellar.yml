leftbar:
  brand:
    style: compact
    name: shamot
    tagline: 学习 · 实践 · 记录
    image:
      src: /blog_page/assets/shamot.svg
      variant: icon
    href: /
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /blog/tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /blog/archives/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
    - id: github
      title: GitHub
      icon: default:link
      url: https://github.com/chadoshamot
appearance:
  preset: minimal
  color_scheme: dark
  colors:
    primary: '#f4d35e'
    accent: '#f4d35e'
    link: '#f4d35e'
  shape:
    radius:
      card: 14px
      card_large: 18px
  typography:
    font_size:
      root: 16px
      code_block: 0.875rem
article:
  style: tech
  listing:
    card_layout: classic
    show_tags: true
  show_reading_time: true
  footer:
    license: false
    share: []
    show_tags: true
profiles:
  home:
    leftbar:
      widgets: []
  blog_index:
    listing_nav:
      enabled: false
  page:
    leftbar:
      widgets: []
  post:
    leftbar:
      widgets: []
    rightbar:
      widgets: [toc]
  wiki_index:
    path: null
  notebooks:
    path: null
footer:
  content: |
    © shamot · 由 [Hexo](https://hexo.io/) 与 [Stellar](https://github.com/xaoxuu/hexo-theme-stellar) 驱动。
features:
  reveal:
    enabled: true
    duration: 300
    interval: 50
    distance: 5
    blur: 0
  card_hover:
    spotlight: false
    tilt: false
  color_scheme_switch:
    enabled: false
  partial_navigation:
    enabled: true
inject:
  head_end: '<link rel="stylesheet" href="/blog_page/assets/shamot.css?v=2">'
structured_data:
  same_as:
    - https://github.com/chadoshamot
